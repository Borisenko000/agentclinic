spring:
  application:
    name: agentclinic-backend
  datasource:
    url: jdbc:sqlite:./data/agentclinic.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  flyway:
    locations: classpath:db/migration

springdoc:
  default-produces-media-type: application/json
